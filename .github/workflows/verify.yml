name: Verify
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests tests -q
        env:
          PYTHONPATH: backend
      - run: python -m chatabae.openapi --output backend/openapi.json
        env:
          PYTHONPATH: backend
      - run: git diff --exit-code -- backend/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic==2.14.1
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/generated/api-schema.ts
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
